services:
  - type: web
    name: ven-app
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    preDeployCommand: |
      python manage.py migrate
    startCommand: gunicorn myapp.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_ALLOWED_HOSTS
        value: ven-app.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://ven-app.onrender.com
      - key: DATABASE_URL
        sync: false
