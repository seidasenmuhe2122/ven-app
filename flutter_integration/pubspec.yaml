name: royal_pro_flutter
description: Royal Pro Flutter integration for article sharing and deep links.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^6.3.3
  share_plus: ^10.0.2
  flutter_tts: ^4.2.0
  google_mobile_ads: ^5.3.1
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2
  in_app_review: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
